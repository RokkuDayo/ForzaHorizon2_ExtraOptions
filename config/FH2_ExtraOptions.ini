; Forza Horizon 2 Extra Options
; Version v0.6.0
; by Arthur (RokkuDayo)

; INI settings are read at game startup.
; Graphics, camera and HUD options are configured in-game and saved to FH2_ExtraOptions.dat.
; 0 = off, 1 = on.

[Global]
; Toggles the entire feature set of the mod on or off.
Enabled=1

[Content]
; Grants entitlements for all DLC content.
; Treasure Map and VIP DLCs have their own toggles below.
; The Storm Island map will not be accessible if you don't have the DLC package mounted, but it's vehicles will be available regardless.
UnlockDLC=1

; Grants entitlement for VIP status and its perks.
; Double credits and XP rewards, and double bonus on wheelspins.
OfflineVIP=1

; Reveals all bonus boards and barn locations on the mainland and Storm Island.
; Also enables the Treasure Map listing in the Extras menu of the Marketplace tab while offline.
; Important: Enabling this, entering the game, saving, disabling this, and then entering the game again will keep all boards discovered.
UnlockTreasureMap=0

; Bypasses Storm Island event requirements for purchasing the Ranger T6 and #7 SST.
UnlockStormIslandCars=1

[Frontend]
; Places the Cars tab immediately to the right of Home in the pause menu.
; Set to 0 to restore the original tab order. Restart required.
CarsNextToHome=1

; Show playground events when the in-game Show All Events option is enabled.
; Championship duplicates and events from the other map remain hidden.
ShowPlaygroundEvents=0

; Holding LB/RB for 0.5 seconds repeats menu button taps at this interval.
; Lower is faster. Range: 20-1000 ms; 0 disables turbo. Restart required.
MenuTurboIntervalMs=100

; Boots straight into the "Press Start" menu.
SkipIntro=1

; Enables the "Get In Car" feature during free-roam.
; You can find it by selecting any car in the "My Cars" section of the pause menu.
GetInCarFromPauseMenu=1

; Adds a combined category after the three original rim categories.
; Adds combined aftermarket and stock-rim library categories without changing the game database.
AllRimsCategory=1

; Enables tabs in the pause menu that require an XBOX Live connection.
EnableMarketplace=1
EnableSocial=1
EnableClubs=1
EnableRivals=1

[Autodrive]
; Set a GPS route in free roam, then use the Autodrive binding to have the game drive you there.
; Press it again, use CancelAutodrive, drive manually, pause or arrive to restore player control.
Enabled=1

[PhotoMode]
; Removes the camera collision detection and boundaries in photo mode.
FreeCamera=1

[Bindings]
; Xbox and keyboard bindings can be used together. None disables a binding.

; Xbox: DPadUp/Down/Left/Right, A, B, X, Y, LB, RB, LT, RT, View, Menu, LeftStick, RightStick.
; Xbox combinations use +, for example LB+Y. LS/RS, Back/Start are accepted aliases.

; Keyboard: A-Z, 0-9, F1-F24, arrows, Space, Enter, Escape, Tab, Backspace,
; Insert, Delete, Home, End, PageUp, PageDown, Shift, Ctrl, Alt, or a Windows virtual-key code (0xNN).

AutodriveXbox=DPadDown
AutodriveKeyboard=F2
CancelAutodriveXbox=None
CancelAutodriveKeyboard=None

; Headlights require a single tap.
; Sharing the binding with the roof toggle retains tap/hold behavior.
HeadlightsXbox=RightStick
HeadlightsKeyboard=F3

; Roof toggle requires a 1.5 second long hold while stationary in free roam.
RoofXbox=RightStick
RoofKeyboard=F4

; Signals require a 0.5 second long hold. A single tap retains the vanilla radio action.
SignalLeftXbox=DPadLeft
SignalLeftKeyboard=None
SignalRightXbox=DPadRight
SignalRightKeyboard=None

; Hazards require a single tap.
; Photo Mode requires a 1 second long hold when sharing the same binding.
HazardsXbox=DPadUp
HazardsKeyboard=None
PhotoModeXbox=DPadUp
PhotoModeKeyboard=None
ShowroomPhotoXbox=View
ShowroomPhotoKeyboard=None
; Car Meet car-view Photo Mode has its own binding (View keeps Change Camera).
CarMeetPhotoXbox=X
CarMeetPhotoKeyboard=None
ReturnToGarageXbox=X
ReturnToGarageKeyboard=None

JumpToManufacturerXbox=View
JumpToManufacturerKeyboard=Tab
RimJumpToManufacturerXbox=Y
RimJumpToManufacturerKeyboard=Tab

ToggleUIXbox=None
ToggleUIKeyboard=F1

[Mods]
; Packages: mods/Forza Horizon 2. Loader caches: mods/Cache.
; Legacy mods/loadorder.txt and mod folders move automatically on startup.
; Reuse the merged database while the base, enabled mods, load order and files match.
; Cache is checked only at startup and rebuilt automatically when needed.
DatabaseCache=1

[Files]
; Loose assets beside the game EXE.
; The priority goes: mediaoverride > mediapc > original media.
; Example: media/Camera.zip/CameraGroups.xml becomes mediaoverride/Camera/CameraGroups.xml.
; Restart the game after changing files.
EnableMediaOverrides=1

[Compatibility]
; Allow user-created content privilege checks locally.
; This has no effect on Mezcal.
DisableParentalLocks=1

; Generate missing Azimuth save commit markers from actual blob sizes and SHA-256.
; Existing commits and save contents stay intact. Native save validation is unchanged.
; This has no effect on Mezcal.
GenerateMissingSaveCommits=1

[Experiments]
; Uses matching saved designs for a random subset of Drivatars.
; Designs are prepared during native loading waits and reused during driving.
; The cache is refreshed at race/free-roam loading transitions.
; Set to 0 and restart to restore the native livery source.
LocalDrivatarLiveries=1
; Maximum decorated Drivatars and prepared designs: 0-32, default 5.
; Higher values use more memory. Restart after changing this value.
MaxDrivatarLiveries=5

; Allows front and rear aero tuning without Forza race bodywork.
; Set to 0 to restore the original equipment requirements and tuning ranges.
; WARNING: Experimental. Forza aero ranges can change stock PI and handling.
UnlockAeroTuning=0

; Expands engine swaps to the complete engine catalog in a private runtime database.
; Keep enabled while using cars saved with one of the added swaps.
; WARNING: Experimental. Initial load time will be increased and browsing the engine list will feel sluggish.
AllEngineSwaps=0

; Makes the existing gearbox variants available across cars, including donor ratios and gear counts.
; Experimental: increases initial load time and creates a long transmission list.
; Added swaps allow full ratio tuning. Keep enabled while using cars saved with them.
; Restart after changing. Original on-disk databases are not edited.
AllTransmissionSwaps=0
