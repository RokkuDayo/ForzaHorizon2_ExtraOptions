; Forza Motorsport 6 Extra Options
; FM6 integration RC1
; Based on the Extra Options framework by Arthur (RokkuDayo)
; and the Forza Motorsport Extra Options framework by Victor Alves.

; Graphics and camera options are configured in the native HUD options menu
; and saved directly to this INI. Changes take effect immediately.
; Restart the game after changing menu or diagnostic switches manually.
; 0 = off, 1 = on for toggle settings.

[FM6]

; --- General ---

; Enable live camera and motion blur adjustments without restarting the game.
; Required for the additional native HUD controls.
LiveControls=1

; --- Frontend / HUD ---

; Add five FOV sliders, motion blur presets and a cockpit blur toggle
; to the game's native HUD options menu. Requires LiveControls=1.
NativeHUD=1

; Show numerical field-of-view values beside the FOV sliders.
NativeHUDReadouts=1

; Show the selected motion blur preset (Off / Short / Long) and
; cockpit blur state (Off / On) beside their respective sliders.
NativeHUDPresetText=1

; --- Graphics ---

; Allow the game's native motion blur in the cockpit camera.
; 0 retains the original cockpit restriction; 1 removes it.
; MotionBlurIntensity must be greater than 0 for visible blur.
CockpitMotionBlur=1

; Scale the game's native motion blur intensity (0-400 percent in live mode).
; Native HUD presets: 0 = Off, 100 = Short (stock), 300 = Long.
; Intermediate values and up to 400 are available by editing this INI.
; Moving the in-game preset slider replaces the custom value with a preset.
MotionBlurIntensity=300

; --- Camera ---

; Override the vertical field of view for each driving camera independently.
; Values are stored in half-degree units: divide by 2 to obtain degrees.
; 0 = original camera FOV; 100-134 = 50-67 degrees in 0.5-degree steps.
; Example: 120 = 60 degrees, 125 = 62.5 degrees, 134 = 67 degrees.
; Nonzero overrides are limited to the supported range in live mode.
; The HUD slider may display a clamped value for a stock FOV below 50 degrees.
; To restore the original camera FOV, set its entry to 0 in this INI.

; Driver / cockpit camera.
FOVDriverHalf=125

; Hood / bonnet camera.
FOVHoodHalf=0

; Bumper camera.
FOVBumperHalf=132

; Near chase camera (third person).
FOVChaseHalf=127

; Far chase camera (third person).
FOVFarChaseHalf=134

; --- Diagnostics ---

; Enable developer-only native UI property and resource diagnostics.
; Leave disabled for normal gameplay.
UIProbe=0
