; Forza Motorsport 5 Extra Options
; Version v0.6.0
; Azimuth only. Title ID 7B35D917.
; This file lives beside winmm.dll and is independent of FH2_ExtraOptions.ini.
; Settings are read at startup. 0 = off, 1 = on. Restart after changes.

[Global]
Enabled=1

[Frontend]
; Hide the blue "Press Y to level faster" banner before/after races and in Free Play.
; 0 restores the original banner. The Y Accelerator action is unchanged.
HideLevelFasterNotification=1
; Hide the Enable/Disable Drivatar Designs shortcut in the race pause menu.
HideDrivatarDesignsButton=1
; Skip intro movies and the early legal disclaimer; keep the Press Start screen.
SkipIntro=1
; Use the native E3 start-screen layout and animations with normal retail sign-in.
; Does not enable the restricted E3 demo mode.
E3StartScreen=0
; Keep the main-menu Marketplace tile and entry action available offline.
EnableMarketplace=1
; Add all aftermarket rims and all factory rims to the rim-style categories.
; Retains the original categories; factory wheels load their donor car assets.
AllRimsCategory=1
; View opens the manufacturer grid in all car selection menus.
; Wheel Styles uses Y, preserving View for the setup manager.
JumpToManufacturer=1

[Content]
; Enable the native profile's VIP status.
OfflineVIP=1

[Files]
; Loose files under Mount\mediaoverride and Mount\mediapc override matching
; paths under Mount\media. Priority: mediaoverride > mediapc > original media.
; Example: Mount\mediaoverride\cars\... replaces Mount\media\cars\...
EnableMediaOverrides=1

[Compatibility]
; Allow multiplayer and user-created content privilege checks locally.
DisableParentalLocks=1
; Generate missing Azimuth v2 save commit markers before FM5 loads its saves.
; Uses each blob's actual size and SHA-256. Existing commits and save data stay intact.
; Only scans data\titles\7B35D917\saves beside azimuth.exe. Restart required.
GenerateMissingSaveCommits=1

[Camera]
; Enable the driving headlight hotkeys configured under [Bindings].
Headlights=1
; Camera, Video and Player Character settings share FM5_ExtraOptions.dat.
; Video-menu livery choices default to Default and apply on restart.
; Player Character defaults to Default and applies when the model next loads.
; BRIGHTNESS opens the native calibration screen.

[Mods]
; FM5 packages go under mods/Forza Motorsport 5 beside azimuth.exe; later loadorder.txt entries win.
Enabled=1
; Reuse the merged database when the base, enabled mods, order and files match.
; Stored under mods\Cache\fm5-db. Rebuilt automatically after changes. 0 disables persistent caching.
DatabaseCache=1

[Bindings]
; Toggle the player's headlights while driving. Use None to unbind.
HeadlightsXbox=RightStick
HeadlightsKeyboard=F3
; Hide/show UI during driving. Opening a menu restores it automatically.
; Keyboard accepts F1-F24, letters, named keys (Space, Tab, etc.), or a virtual-key number.
ToggleUIKeyboard=F1
; Controller accepts None, a button name (View, RightStick, LB, etc.), or a button mask.
; Unbound by default. Choose a button that does not conflict with the game's controls.
ToggleUIXbox=None

[Experiments]
; Use matching designs from My Designs for FM5 Drivatars. Requires Drivatar Designs to be On in HUD settings.
LocalDrivatarLiveries=0
; Maximum opponents assigned local designs per lineup (0-16).
MaxDrivatarLiveries=6
