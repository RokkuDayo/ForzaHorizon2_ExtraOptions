name: Build

# Builds every variant with Zig 0.15.2. Runs when a release is published (and
# attaches the packages to it) or manually from the Actions tab.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      # The FH3 plugins are built with llvm-mingw (clang, mingw-w64 headers and
      # import libraries), as their build.sh scripts expect.
      - name: Set up llvm-mingw
        run: |
          set -euo pipefail
          release=20261020
          name="llvm-mingw-$release-ucrt-ubuntu-22.04-x86_64"
          curl -fsSL "https://github.com/mstorsjo/llvm-mingw/releases/download/$release/$name.tar.xz" | tar -xJ -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/$name/bin" >> "$GITHUB_PATH"

      - name: Build
        run: |
          set -euo pipefail
          zig="$(command -v zig)"
          python build.py "$zig" --output dist/fh2-mezcal/xg.dll
          python build.py "$zig" --azimuth --output dist/fh2-azimuth/winmm.dll
          python build.py "$zig" --azimuth --fh3 --output dist/fh3-azimuth/winmm.dll
          mods="$PWD/dist/fh3-azimuth/mods"
          mkdir -p "$mods/NoPause/plugins" "$mods/GrooveMusicRadio/plugins"
          sh fh3/plugins/NoPause/build.sh "$mods/NoPause/plugins/NoPause.dll"
          sh fh3/plugins/GrooveMusicRadio/build.sh "$mods/GrooveMusicRadio/plugins/GrooveMusicRadio.dll"

      - name: Package
        run: |
          set -euo pipefail
          version="$(sed -n 's/^#define MOD_VERSION "\(.*\)"/\1/p' extra_options.h)"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          cp fh2/fh2_plugin.h dist/fh2-mezcal/
          cp fh2/fh2_plugin.h dist/fh2-azimuth/
          cp fh3/fh3_plugin.h fh3/tools/fh3_zip.py fh3/FH3_ExtraOptions.ini dist/fh3-azimuth/
          # GrooveMusicRadio.ini is written on first start; Spotify's soloist.exe is the player's own.
          cp fh3/plugins/NoPause/NoPause.ini dist/fh3-azimuth/mods/NoPause/
          for variant in fh2-mezcal fh2-azimuth fh3-azimuth; do
            cp LICENSE BUILD.md "dist/$variant/"
            (cd "dist/$variant" && zip -r "../ExtraOptions-$version-$variant.zip" .)
          done
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: ExtraOptions-${{ env.VERSION }}
          path: dist/*.zip
          if-no-files-found: error

      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/*.zip --clobber
