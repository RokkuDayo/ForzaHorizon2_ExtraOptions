name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  azimuth:
    name: Azimuth (FH2, FM5, FH3)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Zig 0.15.2
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'zig.zip'
          Invoke-WebRequest 'https://ziglang.org/download/0.15.2/zig-x86_64-windows-0.15.2.zip' -OutFile $archive
          if ((Get-FileHash $archive).Hash -ne '3a0ed1e8799a2f8ce2a6e6290a9ff22e6906f8227865911fb7ddedc3cc14cb0c') {
            throw 'Zig archive checksum mismatch'
          }
          Expand-Archive $archive $env:RUNNER_TEMP
          Join-Path $env:RUNNER_TEMP 'zig-x86_64-windows-0.15.2' >> $env:GITHUB_PATH

      - name: Install LLVM-MinGW for FH3 plugins
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'llvm-mingw.zip'
          Invoke-WebRequest 'https://github.com/mstorsjo/llvm-mingw/releases/download/20261020/llvm-mingw-20261020-ucrt-x86_64.zip' -OutFile $archive
          if ((Get-FileHash $archive).Hash -ne 'fd5462b7f5d93b2ff981fcd3f9c7e427e47f3203c64ea91c27bcc444eebd74cd') {
            throw 'LLVM-MinGW archive checksum mismatch'
          }
          Expand-Archive $archive $env:RUNNER_TEMP
          Join-Path $env:RUNNER_TEMP 'llvm-mingw-20261020-ucrt-x86_64/bin' >> $env:GITHUB_PATH

      - name: Build Extra Options and FH2 plugins
        run: |
          $zig = (Get-Command zig.exe).Source
          python build.py $zig --azimuth --fm5 --fh3 --build-dir "$env:RUNNER_TEMP/extra-options-build" --output dist/package/winmm.dll
          if ($LASTEXITCODE -ne 0) { throw 'Extra Options build failed' }
          python fh2/plugins/garage-engine-rev/build.py $zig
          if ($LASTEXITCODE -ne 0) { throw 'Garage Revving build failed' }
          python fh2/plugins/weather-control/build.py $zig
          if ($LASTEXITCODE -ne 0) { throw 'Weather Control build failed' }

          Copy-Item config/FH2_ExtraOptions.ini,config/FM5_ExtraOptions.ini,config/FH3_ExtraOptions.ini dist/package
          Copy-Item release/mods dist/package -Recurse
          $mods = 'dist/package/mods/Forza Horizon 2'
          Copy-Item fh2/plugins/garage-engine-rev/dist/EO_GarageEngineRev.dll "$mods/Extra Options - Garage Revving/plugins"
          $weatherBuild = 'fh2/plugins/weather-control/dist/Extra Options - Weather Control/plugins'
          $weatherPackage = "$mods/Extra Options - Weather Control/plugins"
          Copy-Item "$weatherBuild/EO_WeatherControl.dll" $weatherPackage
          Copy-Item "$weatherBuild/EO_WeatherControl" $weatherPackage -Recurse

      - name: Build FH3 plugins
        shell: bash
        run: |
          mods="$PWD/dist/package/mods/Forza Horizon 3"
          mkdir -p "$mods/NoPause/plugins" "$mods/GrooveMusicRadio/plugins"
          sh fh3/plugins/NoPause/build.sh "$mods/NoPause/plugins/NoPause.dll"
          sh fh3/plugins/GrooveMusicRadio/build.sh "$mods/GrooveMusicRadio/plugins/GrooveMusicRadio.dll"
          cp fh3/plugins/NoPause/NoPause.ini "$mods/NoPause/"
          cp fh3/plugins/GrooveMusicRadio/GrooveMusicRadio.ini "$mods/GrooveMusicRadio/"

      - name: Create Azimuth ZIP
        working-directory: dist/package
        run: |
          python -m zipfile -c ../ExtraOptions-Azimuth.zip winmm.dll FH2_ExtraOptions.ini FM5_ExtraOptions.ini FH3_ExtraOptions.ini mods
          if ($LASTEXITCODE -ne 0) { throw 'Azimuth ZIP creation failed' }
          python -m zipfile -t ../ExtraOptions-Azimuth.zip

      - uses: actions/upload-artifact@v7
        with:
          path: dist/ExtraOptions-Azimuth.zip
          archive: false
          if-no-files-found: error
