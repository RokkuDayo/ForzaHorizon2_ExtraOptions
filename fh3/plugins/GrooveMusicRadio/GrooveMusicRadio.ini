; Groove Music Radio: your music on the Groove station. Changes apply when the game starts.
[Music]
; The folder with your music; each folder in it is a playlist. Empty: your Windows Music folder.
; Environment variables work: %USERPROFILE%\Desktop\Songs
Folder=
; 1: titles and artists from the files' tags; 0: from the file names ("Artist - Title.mp3").
ReadTags=1

[spotify]
; Spotify Soloist (Spotify Premium): put soloist.exe in this folder and your Soloist API key below
; (developer.spotify.com/dashboard > Spotify Soloist API Key; keep it private). "Spotify" is then a
; playlist in Audio Options: choose it, and in the Spotify app play on the device below.
enabled=1
api_key=
device=FH3 Radio
; Soloist's starting volume (0-100).
volume=100
; 1: turn Soloist's own sound down so it's only heard on the radio.
quiet_speakers=1
; 1: when the radio switches to Spotify, move Spotify playback to the device above and play.
auto_activate=1

; Music apps: each is a playlist in Audio Options; choose it and play something in the app. While the radio
; plays it, the app's own sound is turned down and put back after (quiet_speakers=0: not). app= names its
; program ("chrome.exe"; empty: the usual ones). Apps without Windows media controls are driven by their
; global shortcuts: set them here as they are in the app ("Ctrl+Alt+Right").
[youtube]
; music.youtube.com in a browser, or installed from the browser as an app
enabled=1
app=
quiet_speakers=1

[netease]
; NetEase Cloud Music (cloudmusic.exe)
enabled=1
app=
quiet_speakers=1
play_pause_key=Ctrl+Alt+P
next_key=Ctrl+Alt+Right

[qqmusic]
; QQ Music (QQMusic.exe)
enabled=1
app=
quiet_speakers=1
play_pause_key=Ctrl+Alt+F5
next_key=Ctrl+Alt+Right
